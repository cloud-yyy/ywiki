version: 2

before:
  hooks:
    # Completions are generated here and shipped in the archive rather than
    # produced by running the binary at install time: Homebrew generates cask
    # completions before the postflight hook clears the quarantine attribute,
    # so Gatekeeper kills the unnotarized binary mid-install.
    - rm -rf completions
    - mkdir completions
    - sh -c 'go run ./cmd/ywiki completion bash > completions/ywiki.bash'
    - sh -c 'go run ./cmd/ywiki completion zsh > completions/_ywiki'
    - sh -c 'go run ./cmd/ywiki completion fish > completions/ywiki.fish'

builds:
  - main: ./cmd/ywiki
    binary: ywiki
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/cloud-yyy/ywiki/internal/version.Version={{.Version}}
      - -X github.com/cloud-yyy/ywiki/internal/version.Commit={{.ShortCommit}}
      - -X github.com/cloud-yyy/ywiki/internal/version.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - completions/*

checksum:
  name_template: "checksums.txt"

release:
  # Make a re-run of a failed release idempotent: without this, assets
  # uploaded by the first attempt make every retry fail with HTTP 422
  # before it reaches the Homebrew step.
  replace_existing_artifacts: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

homebrew_casks:
  - name: ywiki
    binaries:
      - ywiki
    homepage: "https://github.com/cloud-yyy/ywiki"
    description: "Yandex Wiki CLI for humans and LLM agents"
    repository:
      owner: cloud-yyy
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    completions:
      bash: completions/ywiki.bash
      zsh: completions/_ywiki
      fish: completions/ywiki.fish
    hooks:
      post:
        # The release binaries are not Apple-notarized, so Gatekeeper would
        # quarantine them. Clearing the attribute is what makes the cask
        # usable; it is the standard recipe for an unsigned CLI cask.
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ywiki"]
    commit_author:
      name: goreleaserbot
      email: goreleaserbot@users.noreply.github.com
